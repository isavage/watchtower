name: Deploy

on:
  push:
    branches: [main, master, ft/sidebar]
    paths-ignore: ['.gitignore', 'README.md', 'docs/**']
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild Docker images without layer cache"
        required: false
        type: boolean
        default: false
  

# Never run two deploys at once; let the in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: prod-IN
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: isavage/deploy@v3
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}

          compose_file: docker-compose.yml
          # Image is built on the VPS from this repo (no registry).
          build: true
          pull: false
          # `compose down` would delete the watchtower.net network (and
          # disconnect nginx). `up -d --force-recreate` recreates containers
          # cleanly without touching it.
          down: false
          no_cache: ${{ inputs.no_cache || false }}
          # Prune the previous build's image so the disk doesn't fill up.
          cleanup: true
          service_name: watchtower

          # Keep host junk out of the build context — especially node_modules,
          # which would otherwise be COPYed into the image and break esbuild.
          exclude: ".git, .github, .venv, data, node_modules, web/node_modules, web/dist, .env, .env.*"
