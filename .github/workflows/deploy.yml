name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Rebuild Docker images without layer cache"
        required: false
        type: boolean
        default: false

# Never run two deploys at once; let the in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Uncomment if VPS_*/DOPPLER_TOKEN are stored as GitHub Environment secrets
    # (Settings → Environments → production) rather than repo secrets.
    # environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: isavage/deploy@v3
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Doppler service token (dp.st...) — the action installs the Doppler
          # CLI on the VPS and runs `doppler run -- docker compose up -d`,
          # injecting WT_* vars in memory. Nothing is written to disk.
          doppler_token: ${{ secrets.DOPPLER_TOKEN }}

          compose_file: docker-compose.yml
          # Image is built on the VPS from this repo (no registry).
          build: true
          pull: false
          no_cache: ${{ inputs.no_cache || false }}
          # Prune the previous build's image so the disk doesn't fill up.
          cleanup: true
          service_name: watchtower

          # Keep host junk out of the build context — especially node_modules,
          # which would otherwise be COPYed into the image and break esbuild.
          exclude: ".git, .github, .venv, data, node_modules, web/node_modules, web/dist, .env, .env.*"
