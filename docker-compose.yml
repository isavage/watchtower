services:
  watchtower:
    build: .
    image: watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    # Read the HOST's metrics, not the container's own.
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/ufw/ufw.conf:/host/etc/ufw/ufw.conf:ro
      - /etc/default/ufw:/host/etc/default/ufw:ro
      - /etc/ufw/user.rules:/host/etc/ufw/user.rules:ro
      - /etc/nftables.conf:/host/etc/nftables.conf:ro
      # Whole dir: sshd_config includes sshd_config.d/*.conf
      - /etc/ssh:/host/etc/ssh:ro
      - /var/log/auth.log:/host/var/log/auth.log:ro
      - /var/log/secure:/host/var/log/secure:ro
      - watchtower-data:/data
    depends_on:
      - docker-socket-proxy
    # No host port binding: the app is reached only through the reverse proxy
    # container over the shared network (see `networks` below).
    expose:
      - "8080"
    networks:
      - watchtower.net
    environment:
      WT_DB_PATH: /data/watchtower.db
      WT_HOST_ROOT: /host
      # Values come from Doppler (injected via `doppler run` on the VPS) or a
      # local .env file. Required vars fail fast instead of falling back to
      # insecure dev defaults.
      WT_ADMIN_USER: ${WT_ADMIN_USER:-admin}
      WT_ADMIN_PASSWORD: ${WT_ADMIN_PASSWORD:?WT_ADMIN_PASSWORD not set (check Doppler)}
      WT_SECRET_KEY: ${WT_SECRET_KEY:?WT_SECRET_KEY not set (check Doppler)}
      WT_COOKIE_SECURE: ${WT_COOKIE_SECURE:-false}
      WT_SAMPLE_INTERVAL: ${WT_SAMPLE_INTERVAL:-2}
      WT_SESSION_DAYS: ${WT_SESSION_DAYS:-7}
      WT_DOCKER_SOCKET: tcp://docker-socket-proxy:2375
    # Host /proc reads use the existing pid namespace; no ptrace capability is needed.

  # Read-only gateway to the Docker Engine socket; only the endpoints the app
  # actually calls are enabled, everything destructive stays denied.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: watchtower-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      STATS: 1
      IMAGES: 1
      NETWORKS: 1
      # Explicitly off (proxy defaults are also deny):
      EXEC: 0
      CREATE: 0
      POST: 0
      PUT: 0
      PATCH: 0
      DELETE: 0
      BUILDS: 0
      PUSH: 0
      VOLUMES: 0
      SWARM: 0
      SECRETS: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      AUTH: 0
      SYSTEM: 0
      CONFIGS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Not host-published: reachable only from watchtower.net
    expose:
      - "2375"
    networks:
      - watchtower.net

volumes:
  watchtower-data:

networks:
  watchtower.net:
    name: watchtower.net
    driver: bridge
